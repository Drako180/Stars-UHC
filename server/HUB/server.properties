# UHCNet - serveur du hub. Il n'écoute qu'en local : seul le proxy Velocity est accessible depuis Internet.
server-ip=127.0.0.1
server-port=25566
# Obligatoire derrière Velocity : c'est le proxy qui authentifie les joueurs.
online-mode=false
level-name=HUB
motd=UHCNet Hub
max-players=500
gamemode=adventure
force-gamemode=true
difficulty=peaceful
spawn-protection=0
spawn-monsters=false
spawn-animals=false
spawn-npcs=false
allow-nether=false
# Les perks de hub d'UHCRanks (fly) ne doivent pas faire expulser les joueurs.
allow-flight=true
enable-command-block=false
white-list=false
view-distance=10
simulation-distance=6
enable-query=false
enable-rcon=false
